name: Frontend CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'Frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Frontend/hifresh-web

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: Frontend/hifresh-web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Type check
      run: npx tsc --noEmit

    - name: Build production bundle
      run: npm run build
      env:
        NODE_ENV: production

    - name: Check build output
      run: |
        if [ ! -d "dist" ]; then
          echo "Build failed: dist directory not found"
          exit 1
        fi
        echo "Build successful, dist size:"
        du -sh dist

    - name: Build Docker image
      working-directory: ./Frontend/hifresh-web
      run: docker build -t hifresh-frontend:${{ github.sha }} .

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: Frontend/hifresh-web/dist
        retention-days: 7

    - name: Upload Docker image
      if: github.event_name == 'push'
      run: |
        docker save hifresh-frontend:${{ github.sha }} | gzip > frontend-image.tar.gz

    - name: Upload Docker artifact
      if: github.event_name == 'push'
      uses: actions/upload-artifact@v4
      with:
        name: frontend-docker-image
        path: Frontend/hifresh-web/frontend-image.tar.gz
        retention-days: 3
