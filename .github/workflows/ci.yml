name: Full CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hifresh_db_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 23
      uses: actions/setup-java@v4
      with:
        java-version: '23'
        distribution: 'temurin'
        cache: 'maven'

    - name: Build with Maven
      working-directory: ./Backend
      run: mvn clean install -DskipTests

    - name: Run tests
      working-directory: ./Backend
      env:
        SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/hifresh_db_test
        SPRING_DATASOURCE_USERNAME: postgres
        SPRING_DATASOURCE_PASSWORD: test_password
      run: mvn test

    - name: Upload backend artifacts
      uses: actions/upload-artifact@v4
      with:
        name: backend-jar
        path: Backend/server/target/*.jar

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Frontend/hifresh-web

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: Frontend/hifresh-web/package-lock.json

    - name: Install dependencies
      run: npm ci

    - name: Run linter
      run: npm run lint

    - name: Type check
      run: npx tsc --noEmit

    - name: Build
      run: npm run build

    - name: Upload frontend artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-dist
        path: Frontend/hifresh-web/dist

  docker-compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Validate docker-compose.dev.yml
      run: docker compose -f docker-compose.dev.yml config

    - name: Validate docker-compose.prod.yml
      run: docker compose -f docker-compose.prod.yml config

    - name: Check for syntax errors
      run: |
        echo "✓ All docker-compose files are valid"

  integration-check:
    name: Integration Check
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-compose-validation]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download backend artifacts
      uses: actions/download-artifact@v4
      with:
        name: backend-jar
        path: ./artifacts/backend

    - name: Download frontend artifacts
      uses: actions/download-artifact@v4
      with:
        name: frontend-dist
        path: ./artifacts/frontend

    - name: Verify artifacts
      run: |
        echo "Backend artifacts:"
        ls -lh artifacts/backend/
        echo ""
        echo "Frontend artifacts:"
        ls -lh artifacts/frontend/

    - name: Summary
      run: |
        echo "✓ Backend build successful"
        echo "✓ Frontend build successful"
        echo "✓ Docker compose validation passed"
        echo "✓ All integration checks passed"
