services:
  postgres:
    image: postgres:16-alpine
    container_name: hifresh-db
    environment:
      POSTGRES_DB: hifresh_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Appleman6254!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - hifresh-network

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: hifresh-backend-dev
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hifresh_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: Appleman6254!
      SPRING_PROFILES_ACTIVE: dev
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hifresh-network
    volumes:
      - ./Backend/server/src:/app/server/src

  frontend:
    build:
      context: ./Frontend/hifresh-web
      dockerfile: Dockerfile.dev
    container_name: hifresh-frontend-dev
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - hifresh-network
    volumes:
      - ./Frontend/hifresh-web/src:/app/src
    environment:
      - NODE_env=development

volumes:
  postgres_data_dev:

networks:
  hifresh-network:
    driver: bridge


